apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: pooler-example
  namespace: cnpg
spec:
  cluster:
    name: cluster-example
  instances: 1
  type: rw
  template:
    metadata:
      labels:
        app: pooler
  pgbouncer:
    poolMode: session
    parameters:
      max_client_conn: "1000"
      default_pool_size: "10"
  odyssey:
    workers: 2
    resolvers: 2
    databaseName: "app"
    databaseUser: "YXBw"
    password: "cGFzc3dvcmQ="
